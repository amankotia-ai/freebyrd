[package]
name = "calendar"
description = "Freebyrd Calendar: adds and removes Freebyrd's events in Apple Calendar"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "freebyrd-calendar"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDate", "NSError", "NSString"] }
objc2-event-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "EKAlarm",
    "EKCalendar",
    "EKCalendarItem",
    "EKError",
    "EKEvent",
    "EKEventStore",
    "EKObject",
    "EKSource",
    "EKTypes",
] }
