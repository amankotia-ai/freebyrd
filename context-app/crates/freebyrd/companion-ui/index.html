<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Freebyrd">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" href="/icon-192.png">
  <title>Freebyrd</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <button id="mac" type="button" aria-label="Your Mac">
        <span class="dot busy" aria-hidden="true"></span>
        <span id="mac-text">Reaching your Mac…</span>
      </button>
      <button id="island" class="isl" type="button" aria-label="Cards">
        <span class="wing" id="wing-left"></span>
        <span class="says" id="island-says"></span>
        <span class="wing" id="wing-right"></span>
      </button>
      <button id="todo-button" type="button" aria-label="To-do list">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z M16.7 8.3a1 1 0 0 0-1.4 0l-4.8 4.8-1.8-1.8a1 1 0 1 0-1.4 1.4l2.5 2.5a1 1 0 0 0 1.4 0l5.5-5.5a1 1 0 0 0 0-1.4Z"/></svg>
        <span id="todo-count"></span>
      </button>
    </header>
    <nav id="side" aria-label="Places"></nav>
    <main id="main"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
  <script src="/screens.js"></script>
</body>
</html>
