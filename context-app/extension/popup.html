<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; width: 280px; margin: 12px; color: #1d1d1f; }
    h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
    .row { display: flex; justify-content: space-between; gap: 8px; margin: 6px 0; }
    .muted { color: #6e6e73; }
    .ok { color: #1a7f37; }
    .bad { color: #c62828; }
    #last { overflow-wrap: anywhere; }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1c1e; color: #f5f5f7; }
      .muted { color: #a1a1a6; }
    }
  </style>
</head>
<body>
  <h1><img src="icons/icon-32.png" width="18" height="18" alt="">Freebyrd</h1>
  <div class="row"><span>Desktop app</span><span id="connection" class="muted">checking</span></div>
  <div class="row"><label for="paused">Pause reading pages</label><input id="paused" type="checkbox"></div>
  <div class="muted">Last page read</div>
  <div id="last">None yet</div>
  <div id="skip" class="muted"></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
